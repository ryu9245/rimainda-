<script>const SCHEMA=1,STORE='daylight.data.v1';

function dateKey(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function dateOf(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12);}
function plusDays(s,n){const d=dateOf(s);d.setDate(d.getDate()+n);return dateKey(d);}
function validDate(s){return typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&s>='1900-01-01'&&s<='2200-12-31'&&dateKey(dateOf(s))===s;}
function dayDiff(a,b){return Math.round((Date.UTC(...a.split('-').map((n,i)=>i===1?+n-1:+n))-Date.UTC(...b.split('-').map((n,i)=>i===1?+n-1:+n)))/86400000);}
function uid(){return globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);}
function matches(item,date){if(!item.date||date<item.date)return false;if(!item.repeat||item.repeat==='none')return date===item.date;if(item.until&&date>item.until)return false;const a=dateOf(item.date),b=dateOf(date),diff=dayDiff(date,item.date),interval=item.interval||1;if(item.repeat==='daily')return diff%interval===0;if(item.repeat==='weekdays')return ![0,6].includes(b.getDay());if(item.repeat==='weekly')return diff%(7*interval)===0;const months=(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth();const last=new Date(b.getFullYear(),b.getMonth()+1,0).getDate();if(item.repeat==='monthly')return months%interval===0&&b.getDate()===Math.min(a.getDate(),last);if(item.repeat==='monthend')return months%interval===0&&b.getDate()===last;if(item.repeat==='nthweekday')return months%interval===0&&b.getDay()===a.getDay()&&Math.ceil(b.getDate()/7)===Math.ceil(a.getDate()/7);if(item.repeat==='yearly')return (b.getFullYear()-a.getFullYear())%interval===0&&b.getMonth()===a.getMonth()&&b.getDate()===Math.min(a.getDate(),last);return false;}
function occurrence(item,original){const ex=item.exceptions?.[original];if(ex?.skip)return null;return {...item,...(ex||{}),id:item.id,original,date:ex?.date??original,done:ex?.done??(item.repeat==='none'?item.done:false),recurring:item.repeat!=='none'};}
function occurrences(items,start,end){let out=[];for(const item of items){if(item.deleted||!item.date)continue;const seen=new Set();if(item.repeat==='none'){if(item.date>=start&&item.date<=end){let o=occurrence(item,item.date);if(o&&o.date>=start&&o.date<=end)out.push(o);}continue;}for(let date=start;date<=end;date=plusDays(date,1)){if(matches(item,date)){seen.add(date);let o=occurrence(item,date);if(o&&o.date>=start&&o.date<=end)out.push(o);}}for(const [original,ex] of Object.entries(item.exceptions||{})){if(!seen.has(original)&&!ex.skip&&ex.date>=start&&ex.date<=end&&matches(item,original)){let o=occurrence(item,original);if(o)out.push(o);}}}return out.sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.time||'99:99').localeCompare(b.time||'99:99')||a.title.localeCompare(b.title));}
function validateItem(x){if(!x||typeof x!=='object'||typeof x.id!=='string'||x.id.length>100||!x.id||typeof x.title!=='string'||!x.title.trim()||x.title.length>200)throw Error('タイトルまたはIDが不正です');for(const field of ['time','end','until','notes','location'])if(x[field]!==undefined&&typeof x[field]!=='string')throw Error('テキスト項目の形式が不正です');if(x.exceptions!==undefined&&(!x.exceptions||typeof x.exceptions!=='object'||Array.isArray(x.exceptions)))throw Error('繰り返し例外の形式が不正です');if(!['event','task'].includes(x.type)||!Object.hasOwn(CATEGORIES,x.category))throw Error('種類または分類が不正です');if(x.date!==null&&!validDate(x.date))throw Error('日付が不正です');if(x.type==='event'&&!x.date)throw Error('予定には日付が必要です');if(!['none','daily','weekdays','weekly','monthly','monthend','nthweekday','yearly'].includes(x.repeat))throw Error('繰り返し設定が不正です');if(x.repeat!=='none'&&!x.date)throw Error('繰り返しには開始日が必要です');if(!Number.isInteger(x.interval)||x.interval<1||x.interval>99)throw Error('繰り返し間隔が不正です');if(x.until&&(!validDate(x.until)||x.until<x.date))throw Error('終了日が不正です');for(const k of ['time','end'])if(x[k]&&!/^([01]\d|2[0-3]):[0-5]\d$/.test(x[k]))throw Error('時刻が不正です');if(x.time&&x.end&&x.end<=x.time)throw Error('終了時刻は開始時刻より後にしてください');if((x.notes||'').length>10000||(x.location||'').length>500)throw Error('メモまたは場所が長すぎます');if(![0,5,10,15,30,60,1440].includes(x.reminder??0))throw Error('通知設定が不正です');const safe={id:x.id,title:x.title.trim(),type:x.type,category:x.category,date:x.date,time:x.time||'',end:x.end||'',repeat:x.repeat,interval:x.interval,until:x.until||'',notes:x.notes||'',location:x.location||'',priority:!!x.priority,done:!!x.done,reminder:x.reminder||0,exceptions:{},updatedAt:typeof x.updatedAt==='string'?x.updatedAt:new Date().toISOString(),deleted:!!x.deleted};for(const [key,ex] of Object.entries(x.exceptions||{})){if(!validDate(key)||!ex||typeof ex!=='object')throw Error('繰り返し例外が不正です');if(ex.skip){safe.exceptions[key]={skip:true};continue;}const clean=validateItem({...safe,date:key,...ex,id:safe.id,repeat:'none',exceptions:{}});safe.exceptions[key]={};for(const field of ['title','type','category','date','time','end','notes','location','priority','done','reminder']){if(Object.hasOwn(ex,field))safe.exceptions[key][field]=clean[field];}}return safe;}
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=name=>`<svg aria-hidden="true"><use href="#${name}"/></svg>`;
let currentStore=STORE;
let db={schema:SCHEMA,items:[]},page='today',selected=dateKey(),view='day',filter='open',enabled=new Set(Object.keys(CATEGORIES)),undoState=null,saveError=false,editing=null,searchTerm='';
const names={today:'今日',calendar:'カレンダー',tasks:'すべてのタスク',inbox:'受信箱',repeat:'繰り返し'},navIcons={today:'sun',calendar:'cal',tasks:'check',inbox:'inbox',repeat:'repeat'};
try{const raw=localStorage.getItem(currentStore);if(raw){const parsed=JSON.parse(raw);if(parsed.schema!==SCHEMA||!Array.isArray(parsed.items))throw Error('対応していないデータ形式です');db={schema:SCHEMA,items:parsed.items.map(validateItem)};}}catch(e){saveError=true;$('#storage-warning').textContent='保存データを読み込めませんでした。元のデータを保護するため保存を停止しています。設定からバックアップを書き出してください。 '+e.message;$('#storage-warning').classList.remove('hidden');}
function persist(){if(saveError)throw Error('保存が停止しています。設定からデータを保護してください。');localStorage.setItem(currentStore,JSON.stringify(db));$('#save-status').textContent='この端末に保存済み';$('#footer-status').textContent='このブラウザに保存済み · '+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});}
function commit(fn,message='保存しました'){const before=JSON.stringify(db);try{fn();persist();undoState=before;render();toast(message,true);return true;}catch(e){db=JSON.parse(before);toast('保存できませんでした：'+e.message);return false;}}
function undo(){if(!undoState)return;const next=JSON.parse(undoState),current=new Map(db.items.map(x=>[x.id,x]));const before=JSON.stringify(db);const now=new Date().toISOString();for(const item of next.items){if(JSON.stringify(item)!==JSON.stringify(current.get(item.id)))item.updatedAt=now;current.delete(item.id);}for(const item of current.values())next.items.push({...item,deleted:true,updatedAt:now});try{db=next;persist();undoState=null;render();toast('元に戻しました');}catch(e){db=JSON.parse(before);toast(e.message);}}
let toastTimer;function toast(message,withUndo=false){clearTimeout(toastTimer);$('#toast').textContent=message;if(withUndo){const b=document.createElement('button');b.textContent='取り消す';b.onclick=undo;$('#toast').append(b);}$('#toast').classList.remove('hidden');toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),6000);}
function activeItems(){return db.items.filter(x=>!x.deleted&&enabled.has(x.category));}function onDate(date){return occurrences(activeItems(),date,date);}function shortDate(date){return date?dateOf(date).toLocaleDateString('ja-JP',{month:'numeric',day:'numeric',weekday:'short'}):'日付未定';}function fullDate(date){return dateOf(date).toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'long'});}function repeatLabel(item){const n=item.interval||1;return({none:'繰り返しなし',daily:n===1?'毎日':`${n}日ごと`,weekdays:'平日のみ',weekly:n===1?'毎週':`${n}週間ごと`,monthly:n===1?'毎月（同日・月末補正）':`${n}か月ごと`,monthend:'毎月末',nthweekday:'毎月 第'+Math.ceil(dateOf(item.date||dateKey()).getDate()/7)+['日','月','火','水','木','金','土'][dateOf(item.date||dateKey()).getDay()]+'曜日',yearly:n===1?'毎年':`${n}年ごと`})[item.repeat];}
function occAttrs(o){return `data-id="${esc(o.id)}" data-original="${esc(o.original||'')}"`;}
function taskMarkup(o){const c=CATEGORIES[o.category];return `<div class="task ${o.done?'done':''}" data-occ ${occAttrs(o)}><button class="check" data-action="toggle" ${occAttrs(o)} aria-label="${esc(o.title)}を${o.done?'未完了':'完了'}にする" aria-pressed="${!!o.done}"></button><button class="task-content" data-action="edit" ${occAttrs(o)}><b>${esc(o.title)}</b><p class="${o.date&&o.date<dateKey()&&!o.done?'overdue':''}">${o.priority?'! ':''}${esc(shortDate(o.date))}${o.time?' · '+esc(o.time):''} · ${c.name}${o.recurring?' · ↻ '+esc(repeatLabel(o)):''}</p></button><i class="dot" style="background:${c.color}"></i></div>`;}
function eventMarkup(o){const c=CATEGORIES[o.category];return `<div class="agenda-row"><div class="agenda-time">${o.time||'終日'}${o.end?'<br>'+esc(o.end):''}</div><button class="agenda-event ${o.done?'done':''}" style="--color:${c.color};--tint:${c.tint}" data-action="edit" ${occAttrs(o)} draggable="true"><b>${esc(o.title)}</b><p>${esc(o.location||c.name)}${o.recurring?' · ↻ '+esc(repeatLabel(o)):''}</p>${o.notes?'<p>'+esc(o.notes.slice(0,80))+'</p>':''}</button></div>`;}
function renderNav(){const markup=Object.keys(names).map(key=>`<button data-page="${key}" class="${page===key?'active':''}" ${page===key?'aria-current="page"':''}>${icon(navIcons[key])}${key==='tasks'?'<span class="desktop-label">タスク</span>':names[key]}</button>`).join('');$('#desktop-nav').innerHTML=markup;$('#mobile-nav').innerHTML=markup;$('#filters').innerHTML=Object.entries(CATEGORIES).map(([key,c])=>`<button class="calendar-filter ${enabled.has(key)?'':'off'}" data-category="${key}" aria-pressed="${enabled.has(key)}"><i class="dot" style="background:${c.color}"></i>${c.name}</button>`).join('');}
function monthDates(){const first=selected.slice(0,7)+'-01';const start=plusDays(first,-((dateOf(first).getDay()+6)%7));return Array.from({length:42},(_,i)=>plusDays(start,i));}
function renderMini(){const d=dateOf(selected);$('#mini-title').textContent=d.toLocaleDateString('ja-JP',{year:'numeric',month:'long'});$('#mini').innerHTML=['月','火','水','木','金','土','日'].map(s=>`<span>${s}</span>`).join('')+monthDates().map(s=>`<button data-date="${s}" class="${s===selected?'selected':''} ${s.slice(0,7)!==selected.slice(0,7)?'faded':''}" aria-label="${esc(fullDate(s))}">${dateOf(s).getDate()}</button>`).join('');}
function renderCalendar(){const today=dateKey();$('#schedule-title').textContent=view==='day'?shortDate(selected):dateOf(selected).toLocaleDateString('ja-JP',{year:'numeric',month:'long'});document.querySelectorAll('[data-view]').forEach(b=>{b.classList.toggle('active',b.dataset.view===view);b.setAttribute('aria-pressed',b.dataset.view===view);});if(view==='month'){const dates=monthDates(),all=occurrences(activeItems(),dates[0],dates.at(-1));$('#calendar').innerHTML='<div class="month-board">'+['月','火','水','木','金','土','日'].map(d=>`<div class="weekday">${d}</div>`).join('')+dates.map(d=>{const list=all.filter(o=>o.date===d);return `<div class="month-cell ${d===selected?'selected':''} ${d.slice(0,7)!==selected.slice(0,7)?'faded':''}" data-drop="${d}"><button class="month-number ${d===today?'today':''}" data-date="${d}" aria-label="${esc(fullDate(d))}">${dateOf(d).getDate()}</button>${list.slice(0,3).map(o=>{const c=CATEGORIES[o.category];return `<button class="month-event" style="--color:${c.color};--tint:${c.tint}" data-action="edit" ${occAttrs(o)} draggable="true" title="${esc(o.title)}">${o.done?'✓ ':''}${esc(o.title)}</button>`;}).join('')}${list.length>3?`<button class="month-more" data-date="${d}">ほか${list.length-3}件</button>`:''}<button class="month-more" data-action="add-on" data-date="${d}" aria-label="${esc(fullDate(d))}に追加">＋</button></div>`;}).join('')+'</div>';return;}const monday=plusDays(selected,-((dateOf(selected).getDay()+6)%7));let html='<div class="week-strip">'+Array.from({length:7},(_,i)=>{const d=plusDays(monday,i);return `<button class="day ${d===selected?'active':''}" data-date="${d}" data-drop="${d}"><small>${['月','火','水','木','金','土','日'][i]}</small>${dateOf(d).getDate()}</button>`;}).join('')+'</div><div class="agenda">';const days=view==='week'?Array.from({length:7},(_,i)=>plusDays(monday,i)):[selected];for(const d of days){const events=onDate(d).filter(o=>o.type==='event');if(view==='week')html+=`<div class="agenda-day" data-drop="${d}">${shortDate(d)} <button class="text-btn" data-action="add-on" data-date="${d}">＋</button></div>`;html+=events.length?events.map(eventMarkup).join(''):`<div class="empty">${view==='week'?'予定なし':'予定のない時間も、大切に。'}${view==='day'?'<button class="text-btn" data-action="add">＋ 予定を追加</button>':''}</div>`;}$('#calendar').innerHTML=html+'</div>';}
function taskList(){const items=activeItems();if(page==='inbox')return items.filter(x=>x.type==='task'&&!x.date).map(x=>({...x,original:'',recurring:false}));if(page==='repeat')return items.filter(x=>x.repeat!=='none').map(x=>{const next=occurrences([x],dateKey(),plusDays(dateKey(),366)).find(o=>!o.done);return next||{...x,original:x.date,recurring:true};});if(page==='tasks'){const singles=items.filter(x=>x.type==='task'&&x.repeat==='none').map(x=>({...x,original:x.date||'',recurring:false}));const recurring=occurrences(items.filter(x=>x.type==='task'&&x.repeat!=='none'),plusDays(dateKey(),-30),plusDays(dateKey(),90));return [...singles,...recurring].sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999')||Number(b.priority)-Number(a.priority));}const due=onDate(selected).filter(o=>o.type==='task');const overdue=items.filter(x=>x.type==='task'&&x.repeat==='none'&&x.date&&x.date<selected&&!x.done).map(x=>({...x,original:x.date,recurring:false}));return [...overdue,...due];}
function renderTasks(){let list=taskList();$('#task-title').textContent=page==='inbox'?'日付未定のタスク':page==='repeat'?'繰り返しの予定・タスク':page==='tasks'?'すべてのタスク':shortDate(selected)+'のタスク';$('#task-label').textContent=page==='tasks'?'繰り返しは過去30日〜今後90日を表示':page==='repeat'?'各シリーズの次回を表示 · 開くと全体も編集できます':'ひとつずつ、自分のペースで。';let html='<div class="filters-line">'+[['open','未完了'],['all','すべて'],['done','完了']].map(([k,v])=>`<button class="${filter===k?'active':''}" data-filter="${k}">${v}</button>`).join('')+'</div>';list=list.filter(o=>filter==='all'||(filter==='done'?o.done:!o.done));html+=list.length?list.slice(0,400).map(taskMarkup).join(''):'<div class="empty">'+(filter==='done'?'完了したタスクはまだありません。':'すっきり。表示するタスクはありません。')+'</div>';if(list.length>400)html+='<p class="hint" style="padding:0 23px">最初の400件を表示しています。検索で絞り込めます。</p>';$('#tasks').innerHTML=html;}
function renderSummary(){const all=onDate(selected),events=all.filter(o=>o.type==='event'),tasks=all.filter(o=>o.type==='task');const done=tasks.filter(o=>o.done).length;const overdue=activeItems().filter(x=>x.type==='task'&&x.repeat==='none'&&x.date&&x.date<selected&&!x.done).length;$('#summary').innerHTML=[['cal','この日の予定',events.length,'件'],['check','残りのタスク',tasks.length-done+overdue,'件'],['sun','完了したタスク',done,'件']].map(([ic,label,value,unit])=>`<div class="stat"><div class="stat-icon">${icon(ic)}</div><div><small>${label}</small><strong>${value}<span>${unit}</span></strong></div></div>`).join('');const next=occurrences(activeItems(),plusDays(dateKey(),1),plusDays(dateKey(),60)).find(o=>o.type==='event'&&!o.done);$('#upcoming').innerHTML='<div class="overline">ON THE HORIZON</div>'+(next?`<button class="next-row" data-action="edit" ${occAttrs(next)}><div class="date-square"><small>${dateOf(next.date).getMonth()+1}月</small><b>${dateOf(next.date).getDate()}</b></div><div><strong>${esc(next.title)}</strong><p>${shortDate(next.date)} · ${next.time||'終日'}</p></div></button>`:'<div class="hint" style="margin-top:15px">少し先の予定も、ここで確認できます。</div>');}
function render(){renderNav();renderMini();$('#crumb').textContent=names[page];$('#eyebrow').textContent=dateOf(selected).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}).toUpperCase();$('#page-title').textContent=page==='today'?(selected===dateKey()?'今日も、心地よい一日を。':fullDate(selected)):names[page];$('#subtitle').textContent=({today:'ひとつずつ、自分のペースで進めましょう。',calendar:'少し先の予定まで、ひと目で。',tasks:'やることを整理して、頭の中を軽く。',inbox:'思いついたことを、ひとまずここに。',repeat:'日々の習慣を、心地よいリズムに。'})[page];const list=['tasks','inbox','repeat'].includes(page);$('.schedule').classList.toggle('hidden',list);$('.workspace').classList.toggle('list-mode',list);$('#summary').classList.toggle('hidden',list);renderSummary();renderCalendar();renderTasks();}
function getOcc(id,original){const item=db.items.find(x=>x.id===id&&!x.deleted);if(!item)return null;return original?occurrence(item,original):{...item,original:'',recurring:false};}
function patchOccurrence(o,patch){const item=db.items.find(x=>x.id===o.id);if(item.repeat==='none')Object.assign(item,patch);else item.exceptions[o.original]={...(item.exceptions[o.original]||{}),...patch};item.updatedAt=new Date().toISOString();}
function toggle(o){commit(()=>patchOccurrence(o,{done:!o.done}),o.done?'未完了に戻しました':'おつかれさまです。完了しました。');}
function moveOccurrence(o,date){if(!validDate(date))return;commit(()=>patchOccurrence(o,{date}),shortDate(date)+'に移動しました');}
function navigate(p){page=p;if(p==='today')selected=dateKey();if(p==='calendar')view='month';render();}
function shift(amount,monthly=false){if(monthly||view==='month'){const d=dateOf(selected);d.setDate(1);d.setMonth(d.getMonth()+amount);selected=dateKey(d);}else selected=plusDays(selected,amount*(view==='week'?7:1));render();}
function option(value,label,current){return `<option value="${value}" ${String(current)===String(value)?'selected':''}>${label}</option>`;}
function openEditor(o=null,type='event',date=selected){editing=o?{id:o.id,original:o.original,scope:o.recurring?'one':'all'}:null;const item=o||{title:'',type,category:'work',date:page==='inbox'&&type==='task'?null:date,time:type==='event'?'09:00':'',end:type==='event'?'10:00':'',repeat:'none',interval:1,until:'',notes:'',location:'',priority:false,reminder:0};editorForm(item,o?.recurring);$('#editor').showModal();}
function editorForm(item,recurring=false){const one=recurring&&editing?.scope==='one';$('#editor').innerHTML=`<form id="entry-form"><div class="dialog-top"><h2>${editing?'予定・タスクを編集':'新しく追加'}</h2><button type="button" data-close aria-label="閉じる">×</button></div>${recurring?`<label for="scope">変更する範囲</label><select id="scope" name="scope">${option('one','今回だけ',editing.scope)}${option('all','繰り返し全体',editing.scope)}</select><p class="hint">全体の編集では開始日から設定し直します。個別に変更・完了した回の状態は保持します。</p>`:''}<label for="entry-title">タイトル</label><input id="entry-title" name="title" required maxlength="200" placeholder="何を予定していますか？" value="${esc(item.title)}"><div class="form-row"><div><label for="entry-type">種類</label><select id="entry-type" name="type">${option('event','予定',item.type)}${option('task','タスク',item.type)}</select></div><div><label for="entry-category">カレンダー</label><select id="entry-category" name="category">${Object.entries(CATEGORIES).map(([k,c])=>option(k,c.name,item.category)).join('')}</select></div></div><label for="entry-date">${recurring&&!one?'開始日':'日付'} <span class="hint">タスクは未定でもOK</span></label><input type="date" min="1900-01-01" max="2200-12-31" id="entry-date" name="date" value="${item.date||''}"><div class="form-row"><div><label for="entry-time">開始・期限時刻</label><input type="time" id="entry-time" name="time" value="${esc(item.time)}"></div><div><label for="entry-end">終了時刻</label><input type="time" id="entry-end" name="end" value="${esc(item.end)}"></div></div><p class="hint">時刻を空にすると終日。日をまたぐ予定は日ごとに分けて登録します。</p><div class="form-row ${one?'hidden':''}"><div><label for="entry-repeat">繰り返し</label><select id="entry-repeat" name="repeat">${[['none','なし'],['daily','毎日'],['weekdays','平日のみ'],['weekly','毎週'],['monthly','毎月（同日）'],['monthend','毎月末'],['nthweekday','毎月 第N曜日'],['yearly','毎年']].map(([k,l])=>option(k,l,item.repeat)).join('')}</select></div><div><label for="entry-interval">間隔（日・週・月・年）</label><input type="number" id="entry-interval" name="interval" min="1" max="99" value="${item.interval||1}"></div></div><div class="${one?'hidden':''}"><label for="entry-until">繰り返し終了日（任意）</label><input type="date" id="entry-until" name="until" value="${item.until||''}"><p class="hint">毎月同日は、その日がない月は月末に実行。第5曜日がない月はスキップ。平日のみ・毎月末・第N曜日は間隔1で設定します。</p></div><label for="entry-location">場所・会議URL</label><input id="entry-location" name="location" maxlength="500" value="${esc(item.location)}"><label for="entry-notes">メモ</label><textarea id="entry-notes" name="notes" maxlength="10000" placeholder="必要なことをメモ。">${esc(item.notes)}</textarea><div class="form-row"><div><label for="entry-reminder">リマインダー</label><select id="entry-reminder" name="reminder">${[[0,'なし'],[5,'5分前'],[10,'10分前'],[15,'15分前'],[30,'30分前'],[60,'1時間前'],[1440,'1日前']].map(([k,l])=>option(k,l,item.reminder)).join('')}</select></div><div><label style="margin-top:38px"><input type="checkbox" name="priority" ${item.priority?'checked':''}> 重要な予定・タスク</label></div></div><p class="hint">リマインダーはこのページを開いている間に動作します。</p><p id="form-error" class="form-error" role="alert"></p><div class="actions">${editing?'<button type="button" class="danger" data-action="delete">削除</button>':''}<button type="button" class="secondary" data-close>キャンセル</button><button type="submit" class="add">保存する</button></div></form>`;$('#entry-form').onsubmit=saveEditor;$('#scope')?.addEventListener('change',e=>{editing.scope=e.target.value;const src=editing.scope==='all'?db.items.find(i=>i.id===editing.id):getOcc(editing.id,editing.original);editorForm(src,true);});}
function saveEditor(e){e.preventDefault();const f=new FormData(e.target),existing=editing?db.items.find(x=>x.id===editing.id):null;let data={id:existing?.id||uid(),title:f.get('title'),type:f.get('type'),category:f.get('category'),date:f.get('date')||null,time:f.get('time'),end:f.get('end'),repeat:f.get('repeat'),interval:Number(f.get('interval')),until:f.get('until'),notes:f.get('notes'),location:f.get('location'),priority:f.has('priority'),reminder:Number(f.get('reminder')),done:existing?.done||false,exceptions:existing?.exceptions||{},updatedAt:new Date().toISOString()};const one=existing&&existing.repeat!=='none'&&editing.scope==='one';if(one&&!data.date){$('#form-error').textContent='繰り返しの今回分には日付を指定してください';return;}if(one){data.repeat='none';data.until='';data.exceptions={};data.done=getOcc(editing.id,editing.original)?.done||false;}if(['weekdays','monthend','nthweekday'].includes(data.repeat))data.interval=1;if(data.repeat==='none'){data.until='';data.exceptions={};}if(!data.time)data.end='';try{data=validateItem(data);}catch(err){$('#form-error').textContent=err.message;return;}let overlap=false;if(data.type==='event'&&data.date&&data.time&&data.end)overlap=onDate(data.date).some(o=>o.id!==data.id&&o.type==='event'&&o.time&&o.end&&o.time<data.end&&o.end>data.time);const success=commit(()=>{if(one){const {id,repeat,interval,until,exceptions,updatedAt,...patch}=data;patchOccurrence(getOcc(editing.id,editing.original),patch);}else if(existing){Object.assign(existing,data);}else db.items.push(data);},overlap?'保存しました。同じ時間に別の予定があります。':'保存しました');if(success){$('#editor').close();editing=null;}}
function deleteEditor(){const item=db.items.find(x=>x.id===editing.id);const one=item.repeat!=='none'&&editing.scope==='one';if(!confirm(one?'この回だけ削除しますか？':'この予定・タスクを削除しますか？繰り返しの場合は全体が削除されます。'))return;const success=commit(()=>{if(one){item.exceptions[editing.original]={skip:true};item.updatedAt=new Date().toISOString();}else{item.deleted=true;item.updatedAt=new Date().toISOString();}},one?'今回の予定を削除しました':'削除しました');if(success)$('#editor').close();}
function openSearch(){searchTerm='';$('#search-dialog').innerHTML='<div class="dialog-top"><h2>予定とタスクを検索</h2><button data-close aria-label="閉じる">×</button></div><label for="search-input">タイトル・メモ・場所</label><input id="search-input" placeholder="キーワードを入力"><p class="hint">繰り返しは各シリーズを検索します。</p><div class="search-results" id="search-results"></div>';$('#search-dialog').showModal();$('#search-input').focus();$('#search-input').oninput=()=>{const q=$('#search-input').value.trim().toLowerCase();const list=db.items.filter(x=>!x.deleted&&(!q||[x.title,x.notes,x.location].join(' ').toLowerCase().includes(q))).slice(0,100);$('#search-results').innerHTML=list.length?list.map(x=>taskMarkup({...x,original:x.date||'',recurring:x.repeat!=='none'})).join(''):'<div class="empty">一致する予定はありません。</div>';};$('#search-input').oninput();}
function download(name,content,type='application/json'){const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function exportData(){let data=JSON.stringify({...db,exportedAt:new Date().toISOString()},null,2);if(saveError){try{data=localStorage.getItem(currentStore)||data;}catch{}}download('daylight-backup-'+dateKey()+'.json',data);toast('バックアップを書き出しました');}
async function importData(file){if(!file)return;try{if(file.size>5*1024*1024)throw Error('ファイルは5MBまでです');const raw=JSON.parse(await file.text());if(raw.schema!==SCHEMA||!Array.isArray(raw.items)||raw.items.length>10000)throw Error('Daylightのバックアップを選択してください');const imported=raw.items.map(validateItem);if(new Set(imported.map(x=>x.id)).size!==imported.length)throw Error('重複したIDがあります');if(!confirm(`${imported.filter(x=>!x.deleted).length}件を取り込みます。同じIDはこのファイルの内容で更新します。続けますか？`))return;commit(()=>{const map=new Map(db.items.map(x=>[x.id,x]));for(const item of imported){item.updatedAt=new Date().toISOString();map.set(item.id,item);}db.items=[...map.values()];},'バックアップを取り込みました');}catch(e){toast('読み込めませんでした：'+e.message);}finally{$('#import-file').value='';}}
function openSettings(){$('#settings').innerHTML=`<div class="dialog-top"><h2>設定とデータ管理</h2><button data-close aria-label="閉じる">×</button></div><p class="hint">現在の保存先：この端末のブラウザ（端末間の自動同期なし）<br>ブラウザのデータを消すと予定も消えます。定期的にバックアップを保存してください。</p><div class="settings-section"><h3>バックアップ</h3><div class="actions"><button class="secondary" data-action="export">書き出す</button><button class="secondary" data-action="import">読み込む</button></div><p class="hint">別の端末への移行にも利用できます。</p></div><div class="settings-section"><h3>リマインダー</h3><p class="hint">ページを開いている間、設定した時刻にお知らせします。ページを閉じた状態やスマホのスリープ中の通知には対応していません。</p><button class="secondary" data-action="notify">通知を許可する</button></div><div class="settings-section"><h3>使い方</h3><p class="hint">タスクを右にスワイプすると完了、左で翌日に延期。PCではチェックボタンで完了、カレンダーの日付へドラッグで移動できます。<br>キーボード：Nで新規追加、/で検索、Escで閉じる。</p><button class="secondary" data-action="sample">サンプル予定を追加</button></div>`;$('#settings').showModal();}
function addSamples(){if(!confirm('今日を基準にサンプル予定とタスクを5件追加しますか？'))return;const today=dateKey();commit(()=>{for(const [title,type,time,end,category,repeat] of [['チームミーティング','event','09:00','10:00','work','weekly'],['読書とアイデアの時間','event','13:00','14:30','life','none'],['企画書のドラフトを仕上げる','task','17:00','','work','none'],['観葉植物に水をあげる','task','','','life','weekly'],['今月の家計簿をつける','task','','','life','monthly']])db.items.push(validateItem({id:uid(),title,type,time,end,category,repeat,date:today,interval:1,exceptions:{},done:false,reminder:0,updatedAt:new Date().toISOString()}));},'サンプルを追加しました');}
async function requestNotification(){if(!('Notification'in window)){toast('このブラウザはシステム通知に対応していません。画面内でお知らせします。');return;}try{const p=await Notification.requestPermission();toast(p==='granted'?'通知を許可しました。予定ごとに通知時間を設定できます。':'画面内のお知らせを使用します。');}catch{toast('画面内のお知らせを使用します。');}}
const notified=new Set();function reminders(){const now=Date.now();const all=occurrences(db.items,dateKey(),plusDays(dateKey(),1));for(const o of all){if(o.done||!o.reminder||!o.time)continue;const start=new Date(o.date+'T'+o.time).getTime(),when=start-o.reminder*60000,key=o.id+':'+o.original+':'+o.time+':'+o.reminder;if(now>=when&&now<when+60000&&!notified.has(key)){notified.add(key);toast(o.title+' · '+o.time);if('Notification'in window&&Notification.permission==='granted'){try{new Notification('Daylight',{body:o.title+' · '+o.time,tag:key});}catch{}}}}}
let lastToday=dateKey();setInterval(()=>{const now=dateKey();if(now!==lastToday){if(page==='today'&&selected===lastToday)selected=now;lastToday=now;render();}reminders();},15000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')reminders();});
document.addEventListener('click',e=>{const close=e.target.closest('[data-close]');if(close){close.closest('dialog').close();return;}const nav=e.target.closest('[data-page]');if(nav){navigate(nav.dataset.page);return;}const vf=e.target.closest('[data-view]');if(vf){view=vf.dataset.view;renderCalendar();return;}const cat=e.target.closest('[data-category]');if(cat){enabled.has(cat.dataset.category)?enabled.delete(cat.dataset.category):enabled.add(cat.dataset.category);render();return;}const filt=e.target.closest('[data-filter]');if(filt){filter=filt.dataset.filter;renderTasks();return;}const a=e.target.closest('[data-action]');if(a){const action=a.dataset.action,o=a.dataset.id?getOcc(a.dataset.id,a.dataset.original):null;switch(action){case'add':openEditor();break;case'add-task':openEditor(null,'task');break;case'add-on':openEditor(null,'event',a.dataset.date);break;case'edit':if(o){$('#search-dialog').close();openEditor(o);}break;case'toggle':if(o)toggle(o);break;case'delete':deleteEditor();break;case'today':selected=dateKey();render();break;case'prev':shift(-1);break;case'next':shift(1);break;case'month-back':shift(-1,true);break;case'month-next':shift(1,true);break;case'settings':openSettings();break;case'search':openSearch();break;case'export':exportData();break;case'import':$('#import-file').click();break;case'notify':requestNotification();break;case'sample':addSamples();break;}return;}const d=e.target.closest('[data-date]');if(d){selected=d.dataset.date;if(view==='month')view='day';render();}});
$('#import-file').onchange=e=>importData(e.target.files[0]);
let drag=null;document.addEventListener('dragstart',e=>{const el=e.target.closest('[draggable][data-id]');if(el){drag={id:el.dataset.id,original:el.dataset.original};e.dataTransfer.setData('text/plain',el.dataset.id);e.dataTransfer.effectAllowed='move';}});document.addEventListener('dragover',e=>{const target=e.target.closest('[data-drop]');if(target&&drag){e.preventDefault();target.classList.add('drag-over');}});document.addEventListener('dragleave',e=>e.target.closest('[data-drop]')?.classList.remove('drag-over'));document.addEventListener('drop',e=>{const target=e.target.closest('[data-drop]');if(target&&drag){e.preventDefault();const o=getOcc(drag.id,drag.original);if(o)moveOccurrence(o,target.dataset.drop);}document.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'));drag=null;});document.addEventListener('dragend',()=>{drag=null;document.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'));});
let touch=null,suppressClick=false;document.addEventListener('touchstart',e=>{const el=e.target.closest('.task[data-occ]');if(el)touch={el,x:e.touches[0].clientX,y:e.touches[0].clientY};},{passive:true});document.addEventListener('touchend',e=>{if(!touch)return;const dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y;if(Math.abs(dx)>75&&Math.abs(dy)<45){const o=getOcc(touch.el.dataset.id,touch.el.dataset.original);if(o){dx>0?toggle(o):moveOccurrence(o,plusDays(o.date||dateKey(),1));suppressClick=true;setTimeout(()=>suppressClick=false,400);}}touch=null;},{passive:true});document.addEventListener('click',e=>{if(suppressClick){e.preventDefault();e.stopImmediatePropagation();}},true);
document.addEventListener('keydown',e=>{if(document.querySelector('dialog[open]')||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)||e.metaKey||e.ctrlKey||e.altKey)return;if(e.key.toLowerCase()==='n'){e.preventDefault();openEditor();}if(e.key==='/'){e.preventDefault();openSearch();}});
window.addEventListener('storage',e=>{if(e.key===currentStore&&e.newValue){try{const next=JSON.parse(e.newValue);db={schema:SCHEMA,items:next.items.map(validateItem),cloudBase:next.cloudBase};undoState=null;render();toast('別のタブの変更を反映しました');}catch{toast('別のタブのデータを読み込めませんでした');}}});
render();reminders();
</script></body></html>
